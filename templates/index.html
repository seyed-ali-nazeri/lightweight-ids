<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body { font-family: Arial; background:#111; color:#eee; }
        .box { display:inline-block; padding:15px; margin:10px; background:#222; }
        .critical { color:#B71C1C; }
        .warning { color:#FFA000; }
        .info { color:#00E676; }
        table { width:100%; margin-top:20px; }
    </style>
</head>
<body>

<h1>🔐 IDS/IPS Dashboard -<b style="color: aquamarine;"> seyed ali nazeri - mahdi zaresharif </b></h1>

<div class="box critical">Critical: {{ stats.CRITICAL }}</div>
<div class="box warning">Warning: {{ stats.WARNING }}</div>
<div class="box info">Info: {{ stats.INFO }}</div>

<table border="1">
<tr><th>Time</th><th>Level</th><th>Message</th></tr>
{% for e in events %}
<tr>
<td>{{ e.time }}</td>
<td class="{{ e.level|lower }}">{{ e.level }}</td>
<td>{{ e.message }}</td>
</tr>
{% endfor %}
</table>

</body>
</html>
